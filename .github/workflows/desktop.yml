name: Desktop app

# Pushes and PRs run the desktop smoke test. A v* tag or manual run also builds
# and smoke-tests each platform. Tags publish a GitHub release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  # No GPU under xvfb. SwiftShader provides WebGL 2.
  COASTLINE_SOFTWARE_GL: '1'
  # Packages are deliberately unsigned.
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  smoke:
    name: Smoke test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Allow Electron's sandbox on Ubuntu 24.04 runners
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Desktop smoke test
        run: xvfb-run -a npm run test:electron -- --build
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: desktop-smoke
          path: |
            .artifacts/electron/*.png
            .artifacts/electron/report.json
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build ${{ matrix.name }}
    needs: smoke
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            script: electron:build:win
            unpacked: release/win-unpacked
          - name: Linux
            os: ubuntu-latest
            script: electron:build:linux
            unpacked: release/linux-unpacked
          - name: macOS
            os: macos-latest
            script: electron:build:mac
            unpacked: release/mac-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build packages
        run: npm run ${{ matrix.script }}
      - name: Smoke test the unpacked build (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          xvfb-run -a npm run test:electron -- --packaged
      - name: Smoke test the unpacked build
        if: runner.os == 'Windows'
        run: npm run test:electron -- --packaged
      # macOS runners don't load the WebGL scene reliably. Run for the report only.
      - name: Smoke test the unpacked build (macOS, informational)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: npm run test:electron -- --packaged
      - name: List packages
        shell: bash
        run: ls -la release
      - uses: actions/upload-artifact@v6
        with:
          name: desktop-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.dmg
            release/*.zip
            release/latest*.yml
            release/*.exe.blockmap
          if-no-files-found: error
          # Tagged builds only need to outlast the release job. Manual runs keep a week.
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 1 || 7 }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: desktop-smoke-${{ matrix.name }}
          path: |
            .artifacts/electron/*.png
            .artifacts/electron/report.json
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: desktop-*
          path: packages
          merge-multiple: true
      # Keep latest*.yml and the blockmap. The auto-updater reads them.
      - name: Remove smoke-test files from the release set
        run: find packages -type f ! \( -name '*.exe' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.zip' -o -name 'latest*.yml' -o -name '*.blockmap' \) -delete && ls -la packages
      - uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Desktop builds of Coastline. The Windows installer and AppImage update automatically. The `.yml` and `.blockmap` files are used by the updater.

            - Windows: run `-setup.exe` or `-portable.exe`. If SmartScreen blocks it, click More info → Run anyway.
            - Linux / Steam Deck: download the `.AppImage`, mark it executable and run it. On Steam Deck, add it as a non-Steam game to play in Game Mode.
            - macOS: open the `.dmg` for your chip (arm64 for Apple silicon, x64 for Intel). The first time, right-click the app and choose Open, or run `xattr -cr /Applications/Coastline.app`.

            The builds aren't code-signed. See [ELECTRON.md](https://github.com/jarvisar/coastline/blob/main/ELECTRON.md) for more details.
